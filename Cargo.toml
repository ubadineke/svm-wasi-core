[package]
name = "svm-wasi-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Solana primitives (pubkeys, PDAs, instructions, transactions, RPC) for wasm32-wasip2 WASI components — no solana-sdk/solana-client dependency."
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
# Ed25519 signing, off by default: T0/T1 plugins build unsigned transactions
# and must never pull in key material handling code.
sign = ["dep:ed25519-dalek"]

[dependencies]
bs58 = "0.5"
sha2 = "0.10"
curve25519-dalek = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
ed25519-dalek = { version = "2", optional = true }

# wasi:http client — only compiled for the wasm component, never on the
# host, so `cargo test` never links it (matches `plugins/telegram`'s own
# Cargo.toml in zeroclaw-plugins).
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[dev-dependencies]
