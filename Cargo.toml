[package]
name = "svm-wasi-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "wasm32-wasip2 Solana convenience layer: a waki JSON-RPC client, durable-nonce helpers, and response shaping over the modular solana-*/spl-*-interface crates — not a hand-rolled solana-sdk replacement."
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
# Ed25519 signing, off by default: T0/T1 plugins build unsigned transactions
# and must never pull in key material handling code. Includes rand_core so
# off-host tooling can generate fresh ordinary keypairs (e.g. a durable
# nonce account's own one-time creation signature).
sign = ["dep:ed25519-dalek", "dep:rand_core", "ed25519-dalek/rand_core"]
# A blocking, native (non-wasm) HTTP RPC transport for off-host tooling —
# devnet smoke tests, scripts — where `wasi:http`/`waki` doesn't apply.
# Never used by a plugin itself.
native-http = ["dep:ureq"]
# DKSAP stealth-address math (ephemeral keypairs, ECDH shared secret,
# one-time address derivation). Off by default: only plugins that actually
# do stealth-address work should pull in curve arithmetic.
stealth = ["dep:curve25519-dalek", "dep:sha2", "dep:rand_core", "dep:hex"]
# Recovering a one-time private scalar and signing with it directly (not a
# seed-derived key). Native-only, off-host signer tooling — a human runs
# this on their own machine with keys ZeroClaw never holds. NEVER a plugin
# dependency: `stealth_sign` itself refuses to compile for any wasm target
# (see the module-level `compile_error!`), so this can't be enabled by
# accident inside a wasm component the way a plain feature flag could be.
stealth-sign = ["stealth", "sign", "ed25519-dalek/hazmat"]

[dependencies]
# Modular Solana crates, verified (by us, not just taken on faith) to
# compile clean for wasm32-wasip2 as of this writing — see the crate-level
# doc comment in `lib.rs` for exactly which features that required and what
# it does *not* cover.
solana-pubkey = { version = "4", features = ["curve25519", "sha2"] }
solana-instruction = "3"
solana-message = { version = "4", features = ["serde"] }
solana-hash = "4"
solana-nonce = { version = "3", features = ["serde"] }
solana-system-interface = { version = "3", features = ["bincode"] }
spl-token-interface = "3"
spl-token-2022-interface = "3.1"
spl-memo-interface = "2"
solana-program-pack = "3"
solana-program-error = "3"
solana-short-vec = "3"
solana-signature = { version = "3", features = ["serde"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1.3"
thiserror = "2"
ed25519-dalek = { version = "2", optional = true }
ureq = { version = "3", optional = true, features = ["json"] }
curve25519-dalek = { version = "4", optional = true, default-features = false, features = [
    "alloc",
    "precomputed-tables",
    "digest",
    "rand_core",
    "zeroize",
] }
sha2 = { version = "0.10", optional = true, default-features = false }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }
hex = { version = "0.4", optional = true }

# wasi:http client — only compiled for the wasm component, never on the
# host, so `cargo test` never links it (matches `plugins/telegram`'s own
# Cargo.toml in zeroclaw-plugins).
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[dev-dependencies]
hex = "0.4"
# Masked stdin prompts for the `sign_and_broadcast_sweep` example only —
# never linked into the library itself (dev-dependencies never are), so
# this can't end up in a plugin's wasm component build either way.
rpassword = "7"

[[example]]
name = "sign_and_broadcast_sweep"
required-features = ["stealth-sign", "native-http"]

[[example]]
name = "generate_stealth_meta_address"
required-features = ["stealth"]

[[example]]
name = "create_durable_nonce_account"
required-features = ["sign", "native-http"]
